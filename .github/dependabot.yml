version: 2
updates:
  - package-ecosystem: npm
    directories:
      - '/'
      - '/test/apps/*'
    schedule:
      interval: weekly
      timezone: America/Chicago
    cooldown:
      default-days: 7
    ignore:
      # SvelteKit 3.x requires typescript ^6 and uses its JS API, which TypeScript 7 removed
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    labels:
      - dependabot 🤖
    groups:
      npm:
        patterns:
          - '*'
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      timezone: America/Chicago
    cooldown:
      default-days: 7
    labels:
      - dependabot 🤖
    groups:
      gha:
        patterns:
          - '*'
